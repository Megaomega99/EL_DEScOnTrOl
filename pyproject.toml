[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cartpole-lab"
version = "0.1.0"
description = "Control clásico vs. aprendizaje por refuerzo sobre CartPole-v1 (Gymnasium): material docente."
requires-python = ">=3.13"
# Las versiones exactas viven en requirements.txt (pins '=='); aquí no se repiten
# para no tener dos fuentes de verdad que puedan divergir.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" permite correr los tests sin instalar el paquete; "." permite `from tests.conftest import ...`.
pythonpath = ["src", "."]
addopts = "-ra"
filterwarnings = ["error"]  # un warning de Gymnasium/NumPy en los tests es un fallo, no ruido
